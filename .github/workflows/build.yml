name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 配置 Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Linux 系统编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            ccache \
            zip \
            unzip \
            libncurses5 \
            libncursesw5 \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake

      - name: 安装 Buildozer 与 Cython
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "Cython<3.0" buildozer virtualenv

      - name: 执行 Buildozer 编译 Android Debug APK
        run: |
          buildozer android debug

      - name: 上传 APK 安装包至产物
        uses: actions/upload-artifact@v4
        with:
          name: okx-quant-station-apk
          path: bin/*.apk
